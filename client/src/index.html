<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexSuite - Enterprise AI Business Management System</title>

  <!-- Custom ApexSuite SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f34b7d'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <meta property="og:title" content="ApexSuite - AI Business Management System">
  <meta property="og:description" content="Production AI-Powered Enterprise Business Management System offered by Shigosag">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="dark-theme h-full font-sans antialiased overflow-hidden flex flex-col">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-5 right-5 z-[100] space-y-2 pointer-events-none"></div>

  <!-- Auth Screen Modal Overlay -->
  <div id="loginScreen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="glass-panel p-8 rounded-2xl w-full max-w-md space-y-5 border border-slate-800 shadow-2xl">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold tracking-tight">Apex<span class="pink-brand-text">Suite</span></h1>
        <p class="text-xs text-gray-400">Offered by <span class="pink-brand-text font-bold">Shigosag</span></p>
      </div>

      <!-- Auth Alert Banner -->
      <div id="authAlertBanner" class="hidden p-3 rounded-xl border text-xs font-semibold flex items-center gap-2"></div>

      <!-- Auth Tab Switcher -->
      <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl text-xs font-bold text-center">
        <button id="tabSignInBtn" onclick="switchAuthTab('login')" class="py-2 rounded-lg bg-[#f34b7d] text-white transition-all">Sign In</button>
        <button id="tabSignUpBtn" onclick="switchAuthTab('register')" class="py-2 rounded-lg text-gray-400 hover:text-white transition-all">Register Company</button>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" autocomplete="off" class="space-y-4">
        <div>
          <label class="text-xs text-gray-400">Email Address</label>
          <input type="email" id="loginEmail" placeholder="admin@apex.com" autocomplete="off" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-[#f34b7d]">
        </div>
        <div>
          <label class="text-xs text-gray-400">Password</label>
          <div class="relative mt-1">
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="new-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-4 pr-10 py-2.5 text-xs focus:outline-none focus:border-[#f34b7d]">
            <button type="button" onclick="togglePasswordVisibility('loginPass', 'eyeIconLogin')" class="absolute right-3 top-2.5 text-gray-400 hover:text-white">
              <i id="eyeIconLogin" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div class="flex justify-end">
          <button type="button" onclick="openResetPasswordModal()" class="text-[11px] pink-brand-text hover:underline">Forgot Password?</button>
        </div>
        <button type="submit" class="w-full pink-btn py-2.5 rounded-xl font-bold text-xs pink-glow">Authenticate Workspace</button>
      </form>

      <!-- Register Company Form -->
      <form id="registerForm" onsubmit="handleRegisterSubmit(event)" autocomplete="off" class="space-y-3 hidden">
        <div>
          <label class="text-xs text-gray-400">Company Name *</label>
          <input type="text" id="regCompany" placeholder="e.g. Acme Global Corp" autocomplete="off" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs">
        </div>
        <div>
          <label class="text-xs text-gray-400">Admin Full Name *</label>
          <input type="text" id="regAdminName" placeholder="e.g. Segun Arulogun Gabriel" autocomplete="off" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs">
        </div>
        <div>
          <label class="text-xs text-gray-400">Email Address *</label>
          <input type="email" id="regEmail" placeholder="e.g. admin@acme.com" autocomplete="off" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs">
        </div>
        <div>
          <label class="text-xs text-gray-400">Password *</label>
          <div class="relative mt-1">
            <input type="password" id="regPass" placeholder="••••••••" autocomplete="new-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-4 pr-10 py-2 text-xs">
            <button type="button" onclick="togglePasswordVisibility('regPass', 'eyeIconReg')" class="absolute right-3 top-2.5 text-gray-400 hover:text-white">
              <i id="eyeIconReg" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full pink-btn py-2.5 rounded-xl font-bold text-xs pink-glow">Create Enterprise Account</button>
      </form>
    </div>
  </div>

  <!-- Application Layout -->
  <div id="appLayout" class="h-screen w-screen flex flex-col hidden overflow-hidden">
    <div id="headerContainer" class="shrink-0 z-40"></div>
    <div class="flex-1 flex min-h-0 overflow-hidden relative">
      <div id="sidebarContainer" class="shrink-0 h-full z-30"></div>
      <main id="mainView" class="flex-1 p-6 overflow-y-auto h-full min-w-0"></main>
    </div>
  </div>

  <div id="modalContainer"></div>

  <!-- Client JavaScript Bundles -->
  <script src="services/apiService.js"></script>
  <script src="components/Header.js"></script>
  <script src="components/Sidebar.js"></script>
  <script src="components/Modal.js"></script>
  <script src="pages/DashboardPage.js"></script>
  <script src="pages/CRMPage.js"></script>
  <script src="pages/InventoryPage.js"></script>
  <script src="pages/POSPage.js"></script>
  <script src="pages/FinancePage.js"></script>
  <script src="pages/AIPage.js"></script>
  <script src="pages/SettingsPage.js"></script>
  <script src="main.js"></script>
</body>
</html>
